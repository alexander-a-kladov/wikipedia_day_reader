<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Moved</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        text-align: center;
        padding: 20px;
    }

    .container {
        max-width: 700px;
        width: 100%;
    }

    .image {
        width: min(260px, 60vw);
        margin: 0 auto 30px;
    }

    h1 {
        font-size: clamp(2rem, 5vw, 3.5rem);
        margin-bottom: 20px;
        font-weight: 700;
    }

    p {
        font-size: clamp(1rem, 2vw, 1.3rem);
        color: #cbd5e1;
        margin-bottom: 30px;
        line-height: 1.6;
    }

    .btn {
        display: inline-block;
        padding: 16px 32px;
        font-size: 1.1rem;
        font-weight: bold;
        text-decoration: none;
        color: white;
        background: #2563eb;
        border-radius: 12px;
        transition: all 0.3s ease;
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
    }

    .btn:hover {
        background: #3b82f6;
        transform: translateY(-3px);
    }

    .url {
        display: block;
        margin-top: 20px;
        color: #93c5fd;
        word-break: break-word;
    }
</style>
</head>
<body>

<div class="container">

    <div class="image">
        <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="256" cy="256" r="220" fill="#2563EB"/>
            <path d="M150 256H340" stroke="white" stroke-width="28" stroke-linecap="round"/>
            <path d="M290 186L360 256L290 326" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <h1>Site has moved</h1>

    <p>
        This website has been moved to a new address.
        Please use the link below to continue.
    </p>

    <a class="btn" href="http://thepastandenglishbooks.ru">
        Go to the new website
    </a>

    <span class="url">
        http://thepastandenglishbooks.ru
    </span>

</div>

</body>
</html>
