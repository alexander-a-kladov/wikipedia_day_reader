<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Past and English Books</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3f4f6;
    font-family: Arial, Helvetica, sans-serif;
    color: #222;
}

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #fff;
    border-bottom: 1px solid #ddd;
    padding: 16px 24px;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

#feed {
    max-width: 1400px;
    margin: 24px auto;
    padding: 0 10px;
}

.post {
    background: #fff;
    border-radius: 12px;
    margin-bottom: 24px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.post-actions {
    padding: 0 24px 24px;
}

.share-btn {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 16px;
}


.file-date {
    padding: 14px 20px;
    background: #fafafa;
    border-bottom: 1px solid #eee;
    font-size: 14px;
    font-weight: bold;
    color: #666;
}

.slider {
    position: relative;
    width: 100%;
    overflow: hidden;
}

.slider-track {
    display: flex;
    transition: transform .3s ease;
}

.slide {
    min-width: 100%;
}

.slide img {
    width: 100%;
    height: 750px;
    object-fit: contain;
    display: block;
    background: #fff;
}

.slider-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,.55);
    color: white;
    font-size: 24px;
    cursor: pointer;
    z-index: 10;
}

.slider-btn.prev {
    left: 10px;
}

.slider-btn.next {
    right: 10px;
}

.slider-btn:hover {
    background: rgba(0,0,0,.75);
}

.content {
    padding: 24px;
    line-height: 1.9;
    font-size: 22px;
}

.content a {
    color: #1565c0;
    text-decoration: none;
}

.content a:hover {
    text-decoration: underline;
}

.loading,
.error {
    text-align: center;
    padding: 40px;
    color: #666;
}

@media (max-width: 768px) {

    #feed {
        padding: 0;
        margin: 0;
    }

    .post {
        border-radius: 0;
        margin-bottom: 18px;
    }

    .slide img {
        height: 82vh;
        object-fit: contain;
    }

    .content {
        font-size: 24px;
        line-height: 1.9;
        padding: 22px;
    }

    .file-date,
    .publish-info {
        font-size: 16px;
    }

    .slider-btn {
        width: 52px;
        height: 52px;
        font-size: 28px;
    }
}

.header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.theme-toggle {
    border: none;
    background: #eee;
    border-radius: 8px;
    cursor: pointer;
    padding: 8px 12px;
    font-size: 20px;
}

.theme-toggle:hover {
    opacity: .9;
}

/* ===== ТЕМНАЯ ТЕМА ===== */

body.dark {
    background: #121212;
    color: #e0e0e0;
}

body.dark header {
    background: #1e1e1e;
    border-color: #333;
}

body.dark .post {
    background: #1e1e1e;
    box-shadow: 0 2px 12px rgba(0,0,0,.4);
}

body.dark .file-date {
    background: #252525;
    border-color: #333;
    color: #ccc;
}

body.dark .content {
    color: #e0e0e0;
}

body.dark .content a {
    color: #66b3ff;
}

body.dark .slide img {
    background: #111;
}

body.dark .theme-toggle {
    background: #333;
    color: #fff;
}

body.dark .loading,
body.dark .error {
    color: #bbb;
}

body.dark .share-btn {
    background: #333;
    color: white;
}
</style>
</head>
<body>

<header>
    <div class="header-row">
        <h1>The Past and English Books</h1>

        <button id="themeToggle" class="theme-toggle">
            🌙
        </button>
    </div>
</header>

<div id="feed">
    <div class="loading">Загрузка...</div>
</div>

<script>
const feed = document.getElementById('feed');

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function textToHtml(text) {
    return escapeHtml(text)
        .replace(
            /(https?:\/\/[^\s<]+)/g,
            '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
        )
        .replace(/\n/g, '<br>');
}

function getImagePath(src) {
    const filename = src.split('/').pop();
    return `cache/images/${filename}`;
}

function createPost(fileDate, sourceUrl, post) {

    const article = document.createElement('article');
    article.className = 'post';

    const postId = encodeURIComponent(
        fileDate + '|' + sourceUrl
    );

    article.id = postId;

    let imagesHtml = '';

    if ((post.images || []).length) {

        const slides = post.images.map(img => `
            <div class="slide">
                <img
                    src="${getImagePath(img)}"
                    loading="lazy"
                    alt=""
                >
            </div>
        `).join('');

        imagesHtml = `
            <div class="slider">

                <button
                    class="slider-btn prev"
                    type="button">
                    ‹
                </button>

                <div class="slider-track">
                    ${slides}
                </div>

                <button
                    class="slider-btn next"
                    type="button">
                    ›
                </button>

            </div>
        `;
    }

    article.innerHTML = `
        <div class="file-date">
            ${fileDate}
        </div>

        ${imagesHtml}

        <div class="content">
            ${textToHtml(post.text || '')}
        </div>

        <div class="post-actions">
            <button
                class="share-btn"
                data-post-id="${postId}"
                type="button">
                🔗 Поделиться
            </button>
        </div>
    `;

    return article;
}

function showAllMode() {
    const params = new URLSearchParams(window.location.search);
    return params.get('show_all') === 'true';
}

function scrollToHashPost() {

    const hash =
        decodeURIComponent(
            location.hash.slice(1)
        );

    if (!hash) return;

    const post =
        document.getElementById(hash);

    if (!post) return;

    post.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
    });

    post.style.outline =
        '3px solid #4a90e2';

    post.style.outlineOffset =
        '4px';

    setTimeout(() => {
        post.style.outline = '';
    }, 3000);
}

async function loadFeed() {

    try {

        const indexResponse =
            await fetch('cache/index.json');

        if (!indexResponse.ok) {
            throw new Error(
                'Не удалось загрузить cache/index.json'
            );
        }

        const files =
            await indexResponse.json();

        files.sort((a, b) =>
            b.localeCompare(a)
        );

        feed.innerHTML = '';

        const showAll =
            showAllMode();

        for (const fileName of files) {

            try {

                const response =
                    await fetch(
                        `cache/notes/${fileName}`
                    );

                if (!response.ok) {
                    continue;
                }

                const data =
                    await response.json();

                const fileDate =
                    fileName.replace(
                        /\.json$/i,
                        ''
                    );

                for (const [sourceUrl, post]
                    of Object.entries(data)) {

                    const isPublished =
                        post &&
                        post.published &&
                        post.published.date;

                    if (
                        !showAll &&
                        !isPublished
                    ) {
                        continue;
                    }

                    const card =
                        createPost(
                            fileDate,
                            sourceUrl,
                            post
                        );

                    feed.appendChild(card);

                    initSlider(card);
                }

            } catch (err) {

                console.error(
                    fileName,
                    err
                );
            }
        }

        if (!feed.children.length) {

            feed.innerHTML = `
                <div class="error">
                    Нет опубликованных материалов
                </div>
            `;
        }

       // после того как всё отрисовалось
        scrollToHashPost();

    } catch (err) {

        console.error(err);

        feed.innerHTML = `
            <div class="error">
                Ошибка загрузки ленты
            </div>
        `;
    }
}

function applyTheme(theme) {

    if (theme === 'dark') {

        document.body.classList.add('dark');

        if (themeButton) {
            themeButton.textContent = '☀️';
        }

    } else {

        document.body.classList.remove('dark');

        if (themeButton) {
            themeButton.textContent = '🌙';
        }
    }
}

function initTheme() {

    const saved =
        localStorage.getItem('theme');

    if (saved) {
        applyTheme(saved);
        return;
    }

    const hour = new Date().getHours();

    if (hour >= 20 || hour < 7) {
        applyTheme('dark');
    } else {
        applyTheme('light');
    }
}

function initSlider(card) {

    const slider = card.querySelector('.slider');

    if (!slider) return;

    const track = slider.querySelector('.slider-track');
    const slides = slider.querySelectorAll('.slide');

    if (slides.length <= 1) {
        slider.querySelector('.prev')?.remove();
        slider.querySelector('.next')?.remove();
        return;
    }

    let index = 0;

    function update() {
        track.style.transform =
            `translateX(-${index * 100}%)`;
    }

    slider.querySelector('.next')
        .addEventListener('click', () => {

            index++;

            if (index >= slides.length) {
                index = 0;
            }

            update();
        });

    slider.querySelector('.prev')
        .addEventListener('click', () => {

            index--;

            if (index < 0) {
                index = slides.length - 1;
            }

            update();
        });
}

const themeButton =
    document.getElementById('themeToggle');

themeButton.addEventListener('click', () => {

    const dark =
        document.body.classList.contains('dark');

    const nextTheme =
        dark ? 'light' : 'dark';

    localStorage.setItem(
        'theme',
        nextTheme
    );

    applyTheme(nextTheme);
});

initTheme();

document.addEventListener(
    'click',
    async (e) => {

        const btn =
            e.target.closest('.share-btn');

        if (!btn) return;

        const url =
            location.origin +
            location.pathname +
            '#' +
            btn.dataset.postId;

        if (navigator.share) {

            try {

                await navigator.share({
                    title:
                        'События истории и личности',
                    url
                });

                return;

            } catch (err) {}
        }

        try {

            await navigator.clipboard
                .writeText(url);

            alert(
                'Ссылка скопирована'
            );

        } catch (err) {

            prompt(
                'Скопируйте ссылку:',
                url
            );
        }
    }
);

loadFeed();


</script>

</body>
</html>
