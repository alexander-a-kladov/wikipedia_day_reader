<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Past and English Books</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #f3f4f6;
    font-family: Arial, Helvetica, sans-serif;
    color: #222;
}

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #fff;
    border-bottom: 1px solid #ddd;
    padding: 14px 24px;
}

header h1 { margin: 0; font-size: 24px; }

.date-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.date-tabs { display: flex; gap: 4px; flex-wrap: wrap; }

.date-tab {
    border: 2px solid transparent;
    background: #eee;
    border-radius: 8px;
    padding: 5px 13px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
}

.date-tab:hover { background: #ddd; }

.date-tab.active {
    background: #1565c0;
    color: #fff;
    border-color: #1565c0;
}

#customDateWrap { position: relative; display: flex; align-items: center; }

#customDateInput {
    border: 2px solid #ccc;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    background: #fff;
    color: inherit;
}

#customDateInput:focus { outline: none; border-color: #1565c0; }

#today-btn {
    margin-left: 6px;
    border: none;
    background: #eee;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
}

#today-btn:hover { background: #ddd; }

#feed {
    max-width: 1400px;
    margin: 24px auto;
    padding: 0 10px;
}

.post {
    background: #fff;
    border-radius: 12px;
    margin-bottom: 24px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.post-actions { padding: 0 24px 24px; }

.share-btn {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 16px;
}

.file-date {
    padding: 14px 20px;
    background: #fafafa;
    border-bottom: 1px solid #eee;
    font-size: 14px;
    font-weight: bold;
    color: #666;
}

.slider { position: relative; width: 100%; overflow: hidden; }

.slider-track { display: flex; transition: transform .3s ease; }

.slide { min-width: 100%; }

.slide img {
    width: 100%;
    height: 750px;
    object-fit: contain;
    display: block;
    background: #fff;
}

.slider-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,.55);
    color: white;
    font-size: 24px;
    cursor: pointer;
    z-index: 10;
}

.slider-btn.prev { left: 10px; }
.slider-btn.next { right: 10px; }
.slider-btn:hover { background: rgba(0,0,0,.75); }

.content { padding: 24px; line-height: 1.9; font-size: 22px; }

.content a { color: #1565c0; text-decoration: none; }
.content a:hover { text-decoration: underline; }

.loading, .error { text-align: center; padding: 40px; color: #666; }

.header-row { display: flex; justify-content: space-between; align-items: center; }

.theme-toggle {
    border: none;
    background: #eee;
    border-radius: 8px;
    cursor: pointer;
    padding: 8px 12px;
    font-size: 20px;
    flex-shrink: 0;
}

.theme-toggle:hover { opacity: .9; }

/* ── dark theme ── */
body.dark { background: #121212; color: #e0e0e0; }
body.dark header { background: #1e1e1e; border-color: #333; }
body.dark .post { background: #1e1e1e; box-shadow: 0 2px 12px rgba(0,0,0,.4); }
body.dark .file-date { background: #252525; border-color: #333; color: #ccc; }
body.dark .content { color: #e0e0e0; }
body.dark .content a { color: #66b3ff; }
body.dark .slide img { background: #111; }
body.dark .theme-toggle,
body.dark .date-tab,
body.dark #today-btn { background: #333; color: #e0e0e0; }
body.dark .date-tab:hover,
body.dark #today-btn:hover { background: #444; }
body.dark .date-tab.active { background: #1976d2; border-color: #1976d2; color: #fff; }
body.dark #customDateInput { background: #2a2a2a; border-color: #555; color: #e0e0e0; }
body.dark #customDateInput:focus { border-color: #66b3ff; }
body.dark .loading, body.dark .error { color: #bbb; }
body.dark .share-btn { background: #333; color: white; }

/* ── responsive ── */
@media (max-width: 768px) {
    #feed { padding: 0; margin: 0; }
    .post { border-radius: 0; margin-bottom: 18px; }
    .slide img { height: 82vh; object-fit: contain; }
    .content { font-size: 20px; line-height: 1.6; padding: 18px; }
    .file-date { font-size: 16px; }
    .slider-btn { width: 52px; height: 52px; font-size: 28px; }
    header { padding: 12px 16px; }
    header h1 { font-size: 20px; }
    .date-nav { gap: 6px; }
}
</style>
</head>
<body>

<header>
    <div class="header-row">
        <h1>The Past and English Books</h1>
        <button id="themeToggle" class="theme-toggle">🌙</button>
    </div>
    <div class="date-nav">
        <div class="date-tabs">
            <button class="date-tab" data-offset="-1" type="button">← Вчера</button>
            <button class="date-tab active" data-offset="0" type="button">Сегодня</button>
            <button class="date-tab" data-offset="1" type="button">Завтра →</button>
        </div>
        <div id="customDateWrap">
            <input type="date" id="customDateInput" title="Выбрать дату">
            <button id="today-btn" type="button">↺ Сегодня</button>
        </div>
    </div>
</header>

<div id="feed">
    <div class="loading">Загрузка…</div>
</div>

<script>
/* ─────────────────────────────────────────
   Helpers
───────────────────────────────────────── */

function formatDayMonth(date) {
    return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
}

function toMMDD(date) {
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    return `${mm}-${dd}`;
}

function toISODate(date) {
    // Use local date parts to avoid UTC-offset surprises
    const y  = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    return `${y}-${mm}-${dd}`;
}

function localToday() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
}

function dateOffsetFrom(base, n) {
    const d = new Date(base);
    d.setDate(d.getDate() + n);
    d.setHours(0, 0, 0, 0);
    return d;
}

/**
 * Parse a hash that looks like "MM-DD-N"
 * Returns { mmdd: "MM-DD", num: N } or null.
 */
function parsePostHash(hash) {
    const m = hash.match(/^(\d{2}-\d{2})-(\d+)$/);
    if (!m) return null;
    return { mmdd: m[1], num: parseInt(m[2], 10) };
}

/**
 * Given a "MM-DD" string, build a Date object for that day
 * in the CURRENT year (or next year if the date already passed
 * by more than 6 months — handles New Year edge cases).
 * We don't actually care about the year for display; we only need
 * the Date so setDate() can compute yesterday/today/tomorrow offsets.
 */
function dateFromMMDD(mmdd) {
    const [mm, dd] = mmdd.split('-').map(Number);
    const now = new Date();
    const d = new Date(now.getFullYear(), mm - 1, dd, 0, 0, 0, 0);
    return d;
}

/* ─────────────────────────────────────────
   State
───────────────────────────────────────── */

const feed = document.getElementById('feed');

let selectedDate = localToday();  // will be overridden by hash on boot

/* ─────────────────────────────────────────
   HTML helpers
───────────────────────────────────────── */

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function textToHtml(text) {
    return escapeHtml(text)
        .replace(/(https?:\/\/[^\s<]+)/g,
            '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
        .replace(/\n/g, '<br>');
}

function getImagePath(src) {
    return `cache/images/${src.split('/').pop()}`;
}

/* ─────────────────────────────────────────
   Post card  — id = "MM-DD-N"
───────────────────────────────────────── */

function createPost(mmdd, postNum, displayLabel, sourceUrl, post) {
    const article = document.createElement('article');
    article.className = 'post';

    // Stable, year-free anchor: MM-DD-N
    const anchorId = `${mmdd}-${postNum}`;
    article.id = anchorId;

    let imagesHtml = '';
    if ((post.images || []).length) {
        const slides = post.images.map(img => `
            <div class="slide">
                <img src="${getImagePath(img)}" loading="lazy" alt="">
            </div>
        `).join('');
        imagesHtml = `
            <div class="slider">
                <button class="slider-btn prev" type="button">‹</button>
                <div class="slider-track">${slides}</div>
                <button class="slider-btn next" type="button">›</button>
            </div>
        `;
    }

    article.innerHTML = `
        <div class="file-date">${displayLabel}</div>
        ${imagesHtml}
        <div class="content">${textToHtml(post.text || '')}</div>
        <div class="post-actions">
            <button class="share-btn" data-anchor="${anchorId}" type="button">🔗 Поделиться</button>
        </div>
    `;

    return article;
}

/* ─────────────────────────────────────────
   Slider
───────────────────────────────────────── */

function initSlider(card) {
    const slider = card.querySelector('.slider');
    if (!slider) return;

    const track  = slider.querySelector('.slider-track');
    const slides = slider.querySelectorAll('.slide');

    if (slides.length <= 1) {
        slider.querySelector('.prev')?.remove();
        slider.querySelector('.next')?.remove();
        return;
    }

    let index = 0;
    const update = () => {
        track.style.transform = `translateX(-${index * 100}%)`;
    };

    slider.querySelector('.next').addEventListener('click', () => {
        index = (index + 1) % slides.length;
        update();
    });
    slider.querySelector('.prev').addEventListener('click', () => {
        index = (index - 1 + slides.length) % slides.length;
        update();
    });
}

/* ─────────────────────────────────────────
   Scroll to a post by its anchor id
───────────────────────────────────────── */

function scrollToPost(anchorId) {
    if (!anchorId) return;
    const el = document.getElementById(anchorId);
    if (!el) return;

    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.style.outline = '3px solid #4a90e2';
    el.style.outlineOffset = '4px';
    setTimeout(() => { el.style.outline = ''; }, 3000);
}

/* ─────────────────────────────────────────
   Fetch one day's posts
───────────────────────────────────────── */

function showAllMode() {
    return new URLSearchParams(window.location.search).get('show_all') === 'true';
}

async function fetchDayPosts(date) {
    const mmdd     = toMMDD(date);
    const label    = formatDayMonth(date);
    const showAll  = showAllMode();

    try {
        const resp = await fetch(`cache/notes/${mmdd}.json`);
        if (!resp.ok) return [];

        const data    = await resp.json();
        const results = [];

        for (const [sourceUrl, post] of Object.entries(data)) {
            const published = post && post.published && post.published.date;
            if (!showAll && !published) continue;
            results.push({ mmdd, label, sourceUrl, post });
        }

        return results;
    } catch (err) {
        console.error(`Error loading ${mmdd}.json:`, err);
        return [];
    }
}

/* ─────────────────────────────────────────
   Load feed  (yesterday + selectedDate + tomorrow)
   targetAnchor: if set, scroll there after render
───────────────────────────────────────── */

async function loadFeed(targetAnchor) {
    feed.innerHTML = '<div class="loading">Загрузка…</div>';

    try {
        const dates = [-1, 0, 1].map(n => dateOffsetFrom(selectedDate, n));

        // Fetch in parallel; keep per-day ordering for sequential numbering
        const groups = await Promise.all(dates.map(fetchDayPosts));

        feed.innerHTML = '';

        // Build counters per mmdd so numbering resets each day
        const dayCounters = {};

        let totalRendered = 0;

        for (const group of groups) {
            for (const { mmdd, label, sourceUrl, post } of group) {
                dayCounters[mmdd] = (dayCounters[mmdd] || 0) + 1;
                const postNum = dayCounters[mmdd];

                const card = createPost(mmdd, postNum, label, sourceUrl, post);
                feed.appendChild(card);
                initSlider(card);
                totalRendered++;
            }
        }

        if (!totalRendered) {
            feed.innerHTML = '<div class="error">Нет опубликованных материалов за эти даты</div>';
            return;
        }

        // Scroll after a short paint delay
        if (targetAnchor) {
            setTimeout(() => scrollToPost(targetAnchor), 80);
        }

    } catch (err) {
        console.error(err);
        feed.innerHTML = '<div class="error">Ошибка загрузки ленты</div>';
    }
}

/* ─────────────────────────────────────────
   Date navigation UI
───────────────────────────────────────── */

const dateInput = document.getElementById('customDateInput');
const todayBtn  = document.getElementById('today-btn');
const dateTabs  = document.querySelectorAll('.date-tab');

function syncUI() {
    // Sync <input type=date>
    dateInput.value = toISODate(selectedDate);

    // Highlight the matching tab (yesterday / today / tomorrow) if applicable
    const selStr   = toISODate(selectedDate);
    const todayStr = toISODate(localToday());

    dateTabs.forEach(tab => {
        const offset  = parseInt(tab.dataset.offset, 10);
        const tabDate = dateOffsetFrom(localToday(), offset);
        tab.classList.toggle('active', toISODate(tabDate) === selStr);
    });
}

/** Change the selected date, sync UI, reload feed */
function setDate(date, targetAnchor) {
    date.setHours(0, 0, 0, 0);
    selectedDate = date;
    syncUI();
    loadFeed(targetAnchor);
}

dateTabs.forEach(tab => {
    tab.addEventListener('click', () => {
        const offset = parseInt(tab.dataset.offset, 10);
        setDate(dateOffsetFrom(localToday(), offset));
    });
});

dateInput.addEventListener('change', () => {
    if (!dateInput.value) return;
    const [y, m, d] = dateInput.value.split('-').map(Number);
    setDate(new Date(y, m - 1, d, 0, 0, 0, 0));
});

todayBtn.addEventListener('click', () => setDate(localToday()));

/* ─────────────────────────────────────────
   Share button  — copies  #MM-DD-N  URL
───────────────────────────────────────── */

document.addEventListener('click', async (e) => {
    const btn = e.target.closest('.share-btn');
    if (!btn) return;

    const anchor = btn.dataset.anchor;   // e.g. "06-07-3"
    const url    = `${location.origin}${location.pathname}#${anchor}`;

    if (navigator.share) {
        try { await navigator.share({ title: 'The Past and English Books', url }); return; }
        catch (_) {}
    }

    try {
        await navigator.clipboard.writeText(url);
        //alert('Ссылка скопирована');
        btn.innerHTML = '✅ Ссылка скопирована';
    } catch (_) {
        prompt('Скопируйте ссылку:', url);
    }
});

/* ─────────────────────────────────────────
   Theme
───────────────────────────────────────── */

const themeButton = document.getElementById('themeToggle');

function applyTheme(theme) {
    document.body.classList.toggle('dark', theme === 'dark');
    themeButton.textContent = theme === 'dark' ? '☀️' : '🌙';
}

function initTheme() {
    const saved = localStorage.getItem('theme');
    if (saved) { applyTheme(saved); return; }
    const hour = new Date().getHours();
    applyTheme(hour >= 20 || hour < 7 ? 'dark' : 'light');
}

themeButton.addEventListener('click', () => {
    const next = document.body.classList.contains('dark') ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
});

/* ─────────────────────────────────────────
   Boot  — honour #MM-DD-N in the URL
───────────────────────────────────────── */

initTheme();

(function boot() {
    const raw    = decodeURIComponent(location.hash.slice(1));  // e.g. "06-07-3"
    const parsed = parsePostHash(raw);

    if (parsed) {
        // The link contains a specific post: set the calendar to that day
        // and scroll to the post once the feed is loaded.
        const targetDate   = dateFromMMDD(parsed.mmdd);
        const targetAnchor = raw;          // "MM-DD-N"
        setDate(targetDate, targetAnchor);
    } else {
        setDate(localToday());
    }
})();
</script>

</body>
</html>
