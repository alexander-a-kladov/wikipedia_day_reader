* { box-sizing: border-box; }

html {

<script>
/* ─────────────────────────────────────────
   Helpers
───────────────────────────────────────── */

function formatDayMonth(date) {
    return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
}

function toMMDD(date) {
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    return `${mm}-${dd}`;
}

function toISODate(date) {
    // Use local date parts to avoid UTC-offset surprises
    const y  = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    return `${y}-${mm}-${dd}`;
}

function localToday() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
}

function dateOffsetFrom(base, n) {
    const d = new Date(base);
    d.setDate(d.getDate() + n);
    d.setHours(0, 0, 0, 0);
    return d;
}

/**
 * Parse a hash that looks like "MM-DD-N"
 * Returns { mmdd: "MM-DD", num: N } or null.
 */
function parsePostHash(hash) {
    const m = hash.match(/^(\d{2}-\d{2})-(\d+)$/);
    if (!m) return null;
    return { mmdd: m[1], num: parseInt(m[2], 10) };
}

/**
 * Given a "MM-DD" string, build a Date object for that day
 * in the CURRENT year (or next year if the date already passed
 * by more than 6 months — handles New Year edge cases).
 * We don't actually care about the year for display; we only need
 * the Date so setDate() can compute yesterday/today/tomorrow offsets.
 */
function dateFromMMDD(mmdd) {
    const [mm, dd] = mmdd.split('-').map(Number);
    const now = new Date();
    const d = new Date(now.getFullYear(), mm - 1, dd, 0, 0, 0, 0);
    return d;
}

/* ─────────────────────────────────────────
   State
───────────────────────────────────────── */

const feed = document.getElementById('feed');

let selectedDate = localToday();  // will be overridden by hash on boot

/* ─────────────────────────────────────────
   HTML helpers
───────────────────────────────────────── */

function fixBrokenAnchors(html) {
    // Some exporters produce: <a https:="" en.wikipedia.org="" wiki="" page="">
    // instead of:             <a href="https://en.wikipedia.org/wiki/page">
    // We reconstruct a valid href by joining the broken attribute "keys".
    return html.replace(/<a\s([^>]*)>/gi, (match, attrs) => {
        // Already has a proper href — just ensure target="_blank"
        if (/href\s*=/i.test(attrs)) {
            return `<a ${attrs} target="_blank" rel="noopener noreferrer">`;
        }
        // Broken form: URL was split into attribute name=value pairs by the exporter.
        // E.g. attrs = 'https:="" en.wikipedia.org="" wiki="" tim_berners-lee=""'
        // Collect every token before the "=" signs and join them with "/".
        const parts = [];
        const re = /([^\s=>"']+)\s*=\s*["'][^"']*["']/g;
        let m;
        while ((m = re.exec(attrs)) !== null) {
            parts.push(m[1]);
        }
        if (parts.length) {
            // Re-join: ["https:", "en.wikipedia.org", "wiki", "page"] -> "https://en.wikipedia.org/wiki/page"
            let href = parts.join('/');
            // Fix double-slashes that appear after the protocol colon
            href = href.replace(/^([a-z]+):\/([^/])/, '$1://$2');
            return `<a href="${href}" target="_blank" rel="noopener noreferrer">`;
        }
        return `<a ${attrs} target="_blank" rel="noopener noreferrer">`;
    });
}

function textToHtml(text) {
    if (/<[a-z][\s\S]*>/i.test(text)) {
        return fixBrokenAnchors(text);
    }
    // Plain text fallback
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML
        .replace(/(https?:\/\/[^\s<]+)/g,
            '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
        .replace(/\n/g, '<br>');
}

function getImagePath(src) {
    return `cache/images/${src.split('/').pop()}`;
}

/* ─────────────────────────────────────────
   Post card  — id = "MM-DD-N"
───────────────────────────────────────── */

function createPost(mmdd, postNum, displayLabel, sourceUrl, post) {
    const article = document.createElement('article');
    article.className = 'post';

    // Use the fragment from published.url if available, otherwise fall back to MM-DD-N
    const publishedUrl = post.published && post.published.url;
    const urlFragment  = publishedUrl ? publishedUrl.split('#')[1] : null;
    const anchorId     = urlFragment || `${mmdd}-${postNum}`;
    article.id = anchorId;

    let imagesHtml = '';
    if ((post.images || []).length) {
        const slides = post.images.map(img => `
            <div class="slide">
                <img src="${getImagePath(img)}" loading="lazy" alt="">
            </div>
        `).join('');
        imagesHtml = `
            <div class="slider">
                <button class="slider-btn prev" type="button">‹</button>
                <div class="slider-track">${slides}</div>
                <button class="slider-btn next" type="button">›</button>
            </div>
        `;
    }

    article.innerHTML = `
        <div class="file-date">${displayLabel}</div>
        ${imagesHtml}
        <div class="content">${textToHtml(post.text || '')}</div>
        <div class="post-actions">
            <button class="share-btn" data-anchor="${anchorId}" type="button">🔗 Поделиться</button>
        </div>
    `;

    return article;
}

/* ─────────────────────────────────────────
   Slider
───────────────────────────────────────── */

function initSlider(card) {
    const slider = card.querySelector('.slider');
    if (!slider) return;

    const track  = slider.querySelector('.slider-track');
    const slides = slider.querySelectorAll('.slide');

    if (slides.length <= 1) {
        slider.querySelector('.prev')?.remove();
        slider.querySelector('.next')?.remove();
        return;
    }

    let index = 0;
    const update = () => {
        track.style.transform = `translateX(-${index * 100}%)`;
    };

    slider.querySelector('.next').addEventListener('click', () => {
        index = (index + 1) % slides.length;
        update();
    });
    slider.querySelector('.prev').addEventListener('click', () => {
        index = (index - 1 + slides.length) % slides.length;
        update();
    });
}

/* ─────────────────────────────────────────
   Scroll to a post by its anchor id
───────────────────────────────────────── */

function scrollToPost(anchorId) {
    if (!anchorId) return;
    const el = document.getElementById(anchorId);
    if (!el) return;

    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.style.outline = '3px solid #4a90e2';
    el.style.outlineOffset = '4px';
    setTimeout(() => { el.style.outline = ''; }, 3000);
}

/* ─────────────────────────────────────────
   Fetch one day's posts
───────────────────────────────────────── */

async function fetchDayPosts(date) {
    const mmdd  = toMMDD(date);
    const label = formatDayMonth(date);

    try {
        const resp = await fetch(`cache/notes/${mmdd}.json`);
        if (!resp.ok) return [];

        const data    = await resp.json();
        const results = [];

        for (const [sourceUrl, post] of Object.entries(data)) {
            const published = post && post.published && post.published.date;
            if (!published) continue;
            results.push({ mmdd, label, sourceUrl, post });
        }

        return results;
    } catch (err) {
        console.error(`Error loading ${mmdd}.json:`, err);
        return [];
    }
}

/* ─────────────────────────────────────────
   Load feed  (yesterday + selectedDate + tomorrow)
   targetAnchor: if set, scroll there after render
───────────────────────────────────────── */

async function loadFeed(targetAnchor) {
    feed.innerHTML = '<div class="loading">Загрузка…</div>';

    try {
        const posts = await fetchDayPosts(selectedDate);

        feed.innerHTML = '';

        let postNum = 0;

        for (const { mmdd, label, sourceUrl, post } of posts) {
            postNum++;
            const card = createPost(mmdd, postNum, label, sourceUrl, post);
            feed.appendChild(card);
            initSlider(card);
        }

        if (!postNum) {
            feed.innerHTML = '<div class="error">Нет опубликованных материалов за этот день</div>';
            return;
        }

        // Scroll after a short paint delay
        if (targetAnchor) {
            setTimeout(() => scrollToPost(targetAnchor), 80);
        }

    } catch (err) {
        console.error(err);
        feed.innerHTML = '<div class="error">Ошибка загрузки ленты</div>';
    }
}

/* ─────────────────────────────────────────
   Date navigation UI
───────────────────────────────────────── */

const dateInput = document.getElementById('customDateInput');
const todayBtn  = document.getElementById('today-btn');

function syncUI() {
    dateInput.value = toISODate(selectedDate);
}

/** Change the selected date, sync UI, reload feed */
function setDate(date, targetAnchor) {
    date.setHours(0, 0, 0, 0);
    selectedDate = date;
    syncUI();
    loadFeed(targetAnchor);
}

document.getElementById('prev-day').addEventListener('click', () => {
    setDate(dateOffsetFrom(selectedDate, -1));
});

document.getElementById('next-day').addEventListener('click', () => {
    setDate(dateOffsetFrom(selectedDate, 1));
});

dateInput.addEventListener('change', () => {
    if (!dateInput.value) return;
    const [y, m, d] = dateInput.value.split('-').map(Number);
    setDate(new Date(y, m - 1, d, 0, 0, 0, 0));
});

todayBtn.addEventListener('click', () => setDate(localToday()));

/* ─────────────────────────────────────────
   Share button  — copies  #MM-DD-N  URL
───────────────────────────────────────── */

document.addEventListener('click', async (e) => {
    const btn = e.target.closest('.share-btn');
    if (!btn) return;

    const anchor = btn.dataset.anchor;   // e.g. "06-07-3"
    const url    = `${location.origin}${location.pathname}#${anchor}`;

    if (navigator.share) {
        try { await navigator.share({ title: 'The Past and English Books', url }); return; }
        catch (_) {}
    }

    const original = btn.innerHTML;
    try {
        await navigator.clipboard.writeText(url);
    } catch (_) {
        prompt('Скопируйте ссылку:', url);
    }
    btn.innerHTML = '✅ Ссылка скопирована';
    btn.disabled = true;
    setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 2500);
});

/* ─────────────────────────────────────────
   Theme
───────────────────────────────────────── */

const themeButton = document.getElementById('themeToggle');

function applyTheme(theme) {
    document.body.classList.toggle('dark', theme === 'dark');
    themeButton.textContent = theme === 'dark' ? '☀️' : '🌙';
}

function initTheme() {
    const saved = localStorage.getItem('theme');
    if (saved) { applyTheme(saved); return; }
    const hour = new Date().getHours();
    applyTheme(hour >= 20 || hour < 7 ? 'dark' : 'light');
}

themeButton.addEventListener('click', () => {
    const next = document.body.classList.contains('dark') ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
});

/* ─────────────────────────────────────────
   Boot  — honour #MM-DD-N in the URL
───────────────────────────────────────── */

/* ─────────────────────────────────────────
   Pull-down at bottom → next day
───────────────────────────────────────── */

(function initEdgeNavigation() {
    const THRESHOLD = 72; // px drag needed to trigger

    // ── Hint bars ──
    function makeHint(edge) {
        const el = document.createElement('div');
        Object.assign(el.style, {
            position:       'fixed',
            [edge]:         '0',
            left:           '0',
            right:          '0',
            height:         '52px',
            display:        'flex',
            alignItems:     'center',
            justifyContent: 'center',
            fontSize:       '15px',
            fontWeight:     '600',
            fontFamily:     'Arial, sans-serif',
            color:          '#fff',
            transform:      edge === 'bottom' ? 'translateY(100%)' : 'translateY(-100%)',
            transition:     'transform .18s ease',
            zIndex:         '999',
            pointerEvents:  'none',
            userSelect:     'none',
        });
        document.body.appendChild(el);
        return el;
    }

    const hintNext = makeHint('bottom');
    const hintPrev = makeHint('top');

    function updateTheme() {
        const bg = document.body.classList.contains('dark')
            ? 'rgba(25,118,210,0.95)' : 'rgba(21,101,192,0.92)';
        hintNext.style.background = bg;
        hintPrev.style.background = bg;
    }
    updateTheme();
    new MutationObserver(updateTheme)
        .observe(document.body, { attributes: true, attributeFilter: ['class'] });

    function atBottom() {
        return window.innerHeight + window.scrollY >= document.body.scrollHeight - 6;
    }
    function atTop() {
        return window.scrollY <= 2;
    }
    // Page fits entirely in viewport (short content: 0 or 1 posts)
    function pageIsShort() {
        return document.body.scrollHeight <= window.innerHeight + 6;
    }

    function showHint(el, progress, readyText, pullText) {
        const pct = (1 - Math.min(progress, 1)) * 100;
        const isBottom = el === hintNext;
        el.style.transform = `translateY(${isBottom ? pct : -pct}%)`;
        el.textContent = progress >= 1 ? readyText : pullText;
    }

    function hideHint(el, defaultText) {
        const isBottom = el === hintNext;
        el.style.transform = isBottom ? 'translateY(100%)' : 'translateY(-100%)';
        el.textContent = defaultText;
    }

    // ── Touch ──
    let touchStartY = 0;
    let edge        = null; // 'next' | 'prev' | null
    let triggered   = false;

    document.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
        triggered   = false;
        edge        = null; // resolved on first move
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
        const dy = touchStartY - e.touches[0].clientY; // + = swipe up, - = swipe down

        // Resolve edge on first meaningful move if not yet set
        if (!edge) {
            if (Math.abs(dy) < 6) return; // ignore tiny jitter
            if (dy > 0 && atBottom())  { edge = 'next'; }
            else if (dy < 0 && atTop()) { edge = 'prev'; }
            // Short page: direction alone decides
            else if (pageIsShort() && dy > 0) { edge = 'next'; }
            else if (pageIsShort() && dy < 0) { edge = 'prev'; }
            else { edge = 'none'; }
        }

        if (edge === 'next' && dy > 0) {
            e.preventDefault();
            const p = dy / THRESHOLD;
            showHint(hintNext, p, '✓ Отпустите', '↓ Следующий день');
            if (p >= 1) triggered = true;
        } else if (edge === 'prev' && dy < 0) {
            e.preventDefault();
            const p = (-dy) / THRESHOLD;
            showHint(hintPrev, p, '✓ Отпустите', '↑ Предыдущий день');
            if (p >= 1) triggered = true;
        }
    }, { passive: false });

    document.addEventListener('touchend', () => {
        const wasEdge     = edge;
        const wasTriggered = triggered;
        edge      = null;
        triggered = false;
        hideHint(hintNext, '↓ Следующий день');
        hideHint(hintPrev, '↑ Предыдущий день');
        if (wasTriggered) {
            setTimeout(() => {
                setDate(dateOffsetFrom(selectedDate, wasEdge === 'next' ? 1 : -1));
            }, 120);
        }
    }, { passive: true });

    // ── Mouse wheel (desktop) ──
    let wheelAccum = 0;
    let wheelDir   = null;
    let wheelTimer = null;

    window.addEventListener('wheel', (e) => {
        const goingDown = e.deltaY > 0;
        const goingUp   = e.deltaY < 0;

        if (goingDown && atBottom()) {
            wheelDir = 'next';
        } else if (goingUp && atTop()) {
            wheelDir = 'prev';
        } else {
            wheelAccum = 0; wheelDir = null;
            hideHint(hintNext, '↓ Следующий день');
            hideHint(hintPrev, '↑ Предыдущий день');
            return;
        }

        wheelAccum += Math.abs(e.deltaY);
        const hint = wheelDir === 'next' ? hintNext : hintPrev;
        const p    = wheelAccum / (THRESHOLD * 4);
        showHint(hint, p,
            wheelDir === 'next' ? '✓ Следующий день…' : '✓ Предыдущий день…',
            wheelDir === 'next' ? '↓ Следующий день' : '↑ Предыдущий день');

        clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => {
            const go  = wheelAccum >= THRESHOLD * 4;
            const dir = wheelDir;
            wheelAccum = 0; wheelDir = null;
            hideHint(hintNext, '↓ Следующий день');
            hideHint(hintPrev, '↑ Предыдущий день');
            if (go) setDate(dateOffsetFrom(selectedDate, dir === 'next' ? 1 : -1));
        }, 400);
    }, { passive: true });
})();

initTheme();

(function boot() {
    const raw    = decodeURIComponent(location.hash.slice(1));  // e.g. "06-07-3"
    const parsed = parsePostHash(raw);

    if (parsed) {
        // The link contains a specific post: set the calendar to that day
        // and scroll to the post once the feed is loaded.
        const targetDate   = dateFromMMDD(parsed.mmdd);
        const targetAnchor = raw;          // "MM-DD-N"
        setDate(targetDate, targetAnchor);
    } else {
        setDate(localToday());
    }
})();
</script>
