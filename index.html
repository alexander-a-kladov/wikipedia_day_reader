<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Moved</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        text-align: center;
        padding: 20px;
    }

    .container {
        max-width: 800px;
        width: 100%;
    }

    .logo {
        width: min(320px, 80vw);
        border-radius: 12px;
        box-shadow: 0 15px 40px rgba(0,0,0,.35);
        margin-bottom: 30px;
    }

    h1 {
        font-size: clamp(2.2rem, 5vw, 4rem);
        margin-bottom: 20px;
    }

    p {
        font-size: clamp(1.1rem, 2vw, 1.4rem);
        color: #cbd5e1;
        margin-bottom: 30px;
        line-height: 1.6;
    }

    .btn {
        display: inline-block;
        padding: 18px 36px;
        font-size: 1.2rem;
        font-weight: bold;
        text-decoration: none;
        color: white;
        background: #2563eb;
        border-radius: 12px;
        transition: all .3s ease;
        box-shadow: 0 10px 25px rgba(37,99,235,.35);
    }

    .btn:hover {
        background: #3b82f6;
        transform: translateY(-3px);
    }

    .url {
        display: block;
        margin-top: 30px;
        font-size: clamp(1.4rem, 3vw, 2rem);
        font-weight: bold;
        color: #93c5fd;
        word-break: break-word;
    }

    @media (max-width: 600px) {
        .btn {
            width: 100%;
            max-width: 350px;
        }
    }
</style>
</head>
<body>

<div class="container">

    <!-- Поместите рядом файл logo.jpg или замените путь -->
    <img src="thePastandEnglish.jpg" alt="The Past & English Books" class="logo">

    <h1>Site has moved</h1>

    <p>
        This website has been moved to a new address.
        Please continue using the link below.
    </p>

    <a id="moveLink"
       class="btn"
       href="http://thepastandenglishbooks.ru">
        Go to the new website
    </a>

    <span class="url">
        http://thepastandenglishbooks.ru
    </span>

</div>

<script>
(function() {
    const targetBase = "http://thepastandenglishbooks.ru";
    const hash = window.location.hash || "";

    // передаём только хеши вида #mm-dd-number
    const pattern = /^#\d{2}-\d{2}-\d+$/;

    if (pattern.test(hash)) {
        document.getElementById("moveLink").href = targetBase + hash;
    }
})();
</script>

</body>
</html>
