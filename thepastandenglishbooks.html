<script>
/* ─────────────────────────────────────────
   Helpers
   All post navigation is driven by "MM-DD" strings — the same strings
   used in the notes filenames (MM-DD.json). Lexicographic order of
   these strings equals calendar order within a year, INCLUDING
   "02-29" which sorts correctly between "02-28" and "03-01".
   The real year never enters this logic; it's only used to format the
   <input type=date> picker for display/entry.
───────────────────────────────────────── */

// Fixed reference calendar — always treat February as having 29 days so
// that "02-29" is a valid, navigable day regardless of the real year.
const DAYS_IN_MONTH_LEAP = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

function pad2(n) {
    return String(n).padStart(2, '0');
}

/** Convert a real Date object to a "MM-DD" string. */
function toMMDD(date) {
    return `${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

/** "MM-DD" → { mm, dd } as numbers */
function mmddParts(mmdd) {
    const [mm, dd] = mmdd.split('-').map(Number);
    return { mm, dd };
}

/** Next day after "MM-DD" in the fixed 366-day reference calendar. */
function nextMMDD(mmdd) {
    let { mm, dd } = mmddParts(mmdd);
    dd++;
    if (dd > DAYS_IN_MONTH_LEAP[mm - 1]) {
        dd = 1;
        mm = (mm % 12) + 1;
    }
    return `${pad2(mm)}-${pad2(dd)}`;
}

/** Day before "MM-DD" in the fixed 366-day reference calendar. */
function prevMMDD(mmdd) {
    let { mm, dd } = mmddParts(mmdd);
    dd--;
    if (dd < 1) {
        mm = mm === 1 ? 12 : mm - 1;
        dd = DAYS_IN_MONTH_LEAP[mm - 1];
    }
    return `${pad2(mm)}-${pad2(dd)}`;
}

/**
 * Display label "12 июня" for a "MM-DD" string. Uses a fixed leap
 * reference year (2024) so "02-29" always formats correctly.
 */
function formatDayMonth(mmdd) {
    const { mm, dd } = mmddParts(mmdd);
    const d = new Date(2024, mm - 1, dd);
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
}

/**
 * Build the "YYYY-MM-DD" value for the <input type=date> picker from a
 * "MM-DD" string, always using the REAL current year. If that MM-DD
 * doesn't exist in the current year (i.e. "02-29" in a non-leap year),
 * JS Date naturally rolls it over to "03-01" — which is acceptable.
 */
function mmddToPickerValue(mmdd) {
    const { mm, dd } = mmddParts(mmdd);
    const y = new Date().getFullYear();
    const d = new Date(y, mm - 1, dd);
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

/** Parse the picker's "YYYY-MM-DD" value back into "MM-DD" (year discarded). */
function pickerValueToMMDD(value) {
    const [, m, d] = value.split('-').map(Number);
    return `${pad2(m)}-${pad2(d)}`;
}

/** Today's date as "MM-DD". */
function todayMMDD() {
    return toMMDD(new Date());
}

/**
 * Parse a hash that looks like "MM-DD-N"
 * Returns { mmdd: "MM-DD", num: N } or null.
 */
function parsePostHash(hash) {
    const m = hash.match(/^(\d{2}-\d{2})-(\d+)$/);
    if (!m) return null;
    return { mmdd: m[1], num: parseInt(m[2], 10) };
}

/* ─────────────────────────────────────────
   State
───────────────────────────────────────── */

const feed = document.getElementById('feed');

// Currently displayed day, as "MM-DD" — overridden by hash on boot.
let selectedMMDD = todayMMDD();

/* ─────────────────────────────────────────
   HTML helpers
───────────────────────────────────────── */

function fixBrokenAnchors(html) {
    // Some exporters produce: <a https:="" en.wikipedia.org="" wiki="" page="">
    // instead of:             <a href="https://en.wikipedia.org/wiki/page">
    // We reconstruct a valid href by joining the broken attribute "keys".
    return html.replace(/<a\s([^>]*)>/gi, (match, attrs) => {
        // Already has a proper href — just ensure target="_blank"
        if (/href\s*=/i.test(attrs)) {
            return `<a ${attrs} target="_blank" rel="noopener noreferrer">`;
        }
        // Broken form: URL was split into attribute name=value pairs by the exporter.
        // E.g. attrs = 'https:="" en.wikipedia.org="" wiki="" tim_berners-lee=""'
        // Collect every token before the "=" signs and join them with "/".
        const parts = [];
        const re = /([^\s=>"']+)\s*=\s*["'][^"']*["']/g;
        let m;
        while ((m = re.exec(attrs)) !== null) {
            parts.push(m[1]);
        }
        if (parts.length) {
            // Re-join: ["https:", "en.wikipedia.org", "wiki", "page"] -> "https://en.wikipedia.org/wiki/page"
            let href = parts.join('/');
            // Fix double-slashes that appear after the protocol colon
            href = href.replace(/^([a-z]+):\/([^/])/, '$1://$2');
            return `<a href="${href}" target="_blank" rel="noopener noreferrer">`;
        }
        return `<a ${attrs} target="_blank" rel="noopener noreferrer">`;
    });
}

function textToHtml(text) {
    if (/<[a-z][\s\S]*>/i.test(text)) {
        return fixBrokenAnchors(text);
    }
    // Plain text fallback
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML
        .replace(/(https?:\/\/[^\s<]+)/g,
            '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
        .replace(/\n/g, '<br>');
}

function getImagePath(src) {
    return `cache/images/${src.split('/').pop()}`;
}

/* ─────────────────────────────────────────
   Tag definitions (needed by post card + filter)
───────────────────────────────────────── */

const TAG_LABELS = new Map([
    ['Science',     '🔬 Science (Scientists)'],
    ['Space', '🚀Space (Cosmonauts)'],
    ['Art',         '🎨 Art (Artists)'],
    ['Music',       '🎶 Music (Musicians)'],
    ['Education',   '📚 Education (Educators)'],
    ['Literature',  '📖 Literature (Writers)'],
    ['Politics',    '🗣️ Politics (Politicians)'],
    ['Inventions',  '💡 Inventions (Inventors)'],
    ['Exploration', '🧭 Exploration (Explorers)'],
]);

const TAG_EMOJI = new Map([
    ['Science',     '🔬'],
    ['Space', '🚀'],
    ['Art',         '🎨'],
    ['Music',       '🎶'],
    ['Education',   '📚'],
    ['Literature',  '📖'],
    ['Politics',    '🗣️'],
    ['Inventions',  '💡'],
    ['Exploration', '🧭'],
]);

function buildTagBadges(tags) {
    if (!Array.isArray(tags) || !tags.length) return '';
    const spans = tags.map(t => {
        const emoji = TAG_EMOJI.get(t);
        const label = TAG_LABELS.get(t) || t;
        return emoji ? '<span class="post-tag-badge" title="' + label + '">' + emoji + '</span>' : '';
    }).join('');
    return spans ? '<div class="post-tag-badges">' + spans + '</div>' : '';
}

/* ─────────────────────────────────────────
   Post card  — id = "MM-DD-N"
───────────────────────────────────────── */

function createPost(mmdd, postNum, displayLabel, sourceUrl, post) {
    const article = document.createElement('article');
    article.className = 'post';

    // Use the fragment from published.url if available, otherwise fall back to MM-DD-N
    const publishedUrl = post.published && post.published.url;
    const urlFragment  = publishedUrl ? publishedUrl.split('#')[1] : null;
    const anchorId     = urlFragment || `${mmdd}-${postNum}`;
    article.id = anchorId;

    let imagesHtml = '';
    if ((post.images || []).length) {
        const slides = post.images.map(img => `
            <div class="slide">
                <img src="${getImagePath(img)}" loading="lazy" alt="">
            </div>
        `).join('');
        imagesHtml = `
            <div class="slider">
                <button class="slider-btn prev" type="button">‹</button>
                <div class="slider-track">${slides}</div>
                <button class="slider-btn next" type="button">›</button>
            </div>
        `;
    }

    article.innerHTML = `
        <div class="file-date">
            <span class="file-date-day">${displayLabel}</span>${post.title ? `
            <span class="file-date-title">${post.title}</span>` : ''}
        </div>
        ${imagesHtml}
        <div class="content">${textToHtml(post.text || '')}</div>
        <div class="post-actions">
            <button class="share-btn" data-anchor="${anchorId}" type="button">🔗</button>
            <button class="like-btn" data-post-id="${anchorId}" type="button">
                <span class="like-icon">🤍</span>
                <span class="like-count"></span>
            </button>
        </div>
        ${buildTagBadges(post.tags)}
    `;

    return article;
}

/* ─────────────────────────────────────────
   Slider
───────────────────────────────────────── */

function initSlider(card) {
    const slider = card.querySelector('.slider');
    if (!slider) return;

    const track  = slider.querySelector('.slider-track');
    const slides = slider.querySelectorAll('.slide');

    if (slides.length <= 1) {
        slider.querySelector('.prev')?.remove();
        slider.querySelector('.next')?.remove();
        return;
    }

    let index = 0;
    const update = () => {
        track.style.transform = `translateX(-${index * 100}%)`;
    };

    slider.querySelector('.next').addEventListener('click', () => {
        index = (index + 1) % slides.length;
        update();
    });
    slider.querySelector('.prev').addEventListener('click', () => {
        index = (index - 1 + slides.length) % slides.length;
        update();
    });
}

/* ─────────────────────────────────────────
   Scroll to a post by its anchor id
───────────────────────────────────────── */

function scrollToPost(anchorId) {
    if (!anchorId) return;
    const el = document.getElementById(anchorId);
    if (!el) return;

    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.style.outline = '3px solid #4a90e2';
    el.style.outlineOffset = '4px';
    setTimeout(() => { el.style.outline = ''; }, 3000);
}

/* ─────────────────────────────────────────
   Tag index — cache/index.json
   Maps "MM-DD" → Set of tags present in that day's notes.
   Lets the search loop skip days that can't possibly match
   the active tag filter without fetching each notes file.
───────────────────────────────────────── */

let tagIndex        = null; // Map<"MM-DD", Set<string>> | null (null = unavailable, fall back)
let tagIndexPromise = null;

async function loadTagIndex() {
    if (tagIndex !== null) return tagIndex;
    if (tagIndexPromise) return tagIndexPromise;

    tagIndexPromise = (async () => {
        try {
            const resp = await fetch('cache/index.json');
            if (!resp.ok) throw new Error('index.json not ok');

            const data = await resp.json();
            const map  = new Map();

            for (const entry of data) {
                if (!entry || typeof entry.notes !== 'string') continue;
                const m = entry.notes.match(/(\d{2}-\d{2})\.json$/);
                if (!m) continue;
                map.set(m[1], new Set(Array.isArray(entry.tags) ? entry.tags : []));
            }

            tagIndex = map;
        } catch (err) {
            console.error('Failed to load cache/index.json:', err);
            tagIndex = false; // false = "tried and failed" — fall back to brute-force
        }
        return tagIndex;
    })();

    return tagIndexPromise;
}

/**
 * Decide whether a day (identified by its aggregated tag set from the index)
 * could possibly contain a post matching the active filter.
 * Returns true if the day should be fetched and checked in full.
 */
function indexDayMayMatch(dayTags, activeTags) {
    if (!dayTags) return false;          // no notes file for this day at all
    if (activeTags === null) return true; // no filter — every existing day counts

    // A post with no tags is always shown. We can't see per-post tags from the
    // index, so treat a day with an empty aggregated tag set as "may contain
    // untagged posts" → must be checked.
    if (dayTags.size === 0) return true;

    // Otherwise the day matches only if at least one of its tags is active.
    for (const t of dayTags) {
        if (activeTags.has(t)) return true;
    }
    return false;
}

/* ─────────────────────────────────────────
   Fetch one day's posts
───────────────────────────────────────── */

async function fetchDayPosts(mmdd) {
    const label = formatDayMonth(mmdd);

    try {
        const resp = await fetch(`cache/notes/${mmdd}.json`);
        if (!resp.ok) return [];

        const data    = await resp.json();
        const results = [];

        for (const [sourceUrl, post] of Object.entries(data)) {
            const published = post && post.published && post.published.date;
            if (!published) continue;
            results.push({ mmdd, label, sourceUrl, post });
        }

        return results;
    } catch (err) {
        console.error(`Error loading ${mmdd}.json:`, err);
        return [];
    }
}

/* ─────────────────────────────────────────
   Load feed for selectedMMDD, searching neighboring days if needed
   targetAnchor: if set, scroll there after render
───────────────────────────────────────── */

// Posts for current day — cached to allow re-filtering without re-fetching
let cachedPosts = [];

function filterPosts(posts) {
    const activeTags = getActiveTags();
    return posts.filter(({ post }) => {
        const postTags = Array.isArray(post.tags) ? post.tags : [];
        if (activeTags !== null && postTags.length > 0) {
            return postTags.some(t => activeTags.has(t));
        }
        return true;
    });
}

function noTagsSelected() {
    return [...tagState.values()].every(v => !v);
}

// direction: 1 = search forward (next day), -1 = search backward (prev day)
async function loadFeed(targetAnchor, direction = 1) {
    // If no topics selected — don't switch days, just show message
    if (noTagsSelected()) {
        feed.innerHTML = '<div class="error">Выберите хотя бы одну тему</div>';
        return;
    }

    feed.innerHTML = '<div class="loading">Загрузка…</div>';

    try {
        // Load the lightweight day→tags index once; speeds up the search
        // below by letting us skip days that can't possibly match without
        // fetching their full notes file.
        const index       = await loadTagIndex();   // Map | false
        const activeTags  = getActiveTags();         // null = no filter

        const step = direction === -1 ? prevMMDD : nextMMDD;

        const MAX_SEARCH = 366; // full cycle of the fixed reference calendar
        let searchMMDD = selectedMMDD;

        for (let i = 0; i < MAX_SEARCH; i++) {
            if (index) {
                const dayTags = index.get(searchMMDD);
                if (!indexDayMayMatch(dayTags, activeTags)) {
                    searchMMDD = step(searchMMDD);
                    continue;
                }
            }

            const posts = await fetchDayPosts(searchMMDD);
            const filtered = filterPosts(posts);

            if (filtered.length > 0) {
                if (i > 0) {
                    selectedMMDD = searchMMDD;
                    syncUI();
                }
                cachedPosts = posts;
                rebuildTagMenu();
                renderFeed(targetAnchor);
                return;
            }

            searchMMDD = step(searchMMDD);
        }

        feed.innerHTML = '<div class="error">Нет материалов по выбранным темам</div>';

    } catch (err) {
        console.error(err);
        feed.innerHTML = '<div class="error">Ошибка загрузки ленты</div>';
    }
}

function renderFeed(targetAnchor) {
    feed.innerHTML = '';

    if (noTagsSelected()) {
        feed.innerHTML = '<div class="error">Выберите хотя бы одну тему</div>';
        return;
    }

    const activeTags = getActiveTags(); // null = no filter
    let shownCount = 0;

    // postNum is the post's fixed position within the FULL day list (1-based),
    // independent of the active filter — this keeps fallback anchor IDs
    // ("MM-DD-N") stable no matter which tags are currently selected.
    cachedPosts.forEach(({ mmdd, label, sourceUrl, post }, idx) => {
        const postTags = Array.isArray(post.tags) ? post.tags : [];
        const visible  = activeTags === null
            || postTags.length === 0
            || postTags.some(t => activeTags.has(t));

        if (!visible) return;

        const postNum = idx + 1;
        const card = createPost(mmdd, postNum, label, sourceUrl, post);
        feed.appendChild(card);
        initSlider(card);
        shownCount++;
    });

    if (!shownCount) {
        // Shouldn't normally reach here (loadFeed already skips empty days)
        feed.innerHTML = '<div class="error">Нет материалов по выбранным темам</div>';
        return;
    }

    loadLikes();

    if (targetAnchor) {
        setTimeout(() => scrollToPost(targetAnchor), 80);
    }
}

───────────────────────────────────────── */

function copyToClipboard(text) {
    // Modern API (HTTPS / secure context)
    if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
    }
    // HTTP fallback: execCommand via a temporary textarea
    return new Promise((resolve, reject) => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none;';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
            const ok = document.execCommand('copy');
            document.body.removeChild(ta);
            ok ? resolve() : reject(new Error('execCommand failed'));
        } catch (err) {
            document.body.removeChild(ta);
            reject(err);
        }
    });
}

document.addEventListener('click', async (e) => {
    const btn = e.target.closest('.share-btn');
    if (!btn) return;

    const anchor = btn.dataset.anchor;
    const url    = `${location.origin}${location.pathname}#${anchor}`;

    // Native share sheet (mobile, HTTPS)
    if (navigator.share) {
        try { await navigator.share({ title: 'The Past and English Books', url }); return; }
        catch (_) {}
    }

    const original = btn.innerHTML;
    try {
        await copyToClipboard(url);
        btn.innerHTML = '✅';
        btn.disabled  = true;
        setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 2500);
    } catch (_) {
        // Last resort — user copies manually
        prompt('Скопируйте ссылку:', url);
    }
});

───────────────────────────────────────── */

// tag key → boolean (on/off); all canonical tags always present, all ON by default
function loadTagState() {
    try {
        const saved = localStorage.getItem('tagState');
        if (saved) {
            const obj = JSON.parse(saved);
            return new Map([...TAG_LABELS.keys()].map(k => [k, k in obj ? obj[k] : true]));
        }
    } catch (_) {}
    return new Map([...TAG_LABELS.keys()].map(k => [k, true]));
}

function saveTagState() {
    const obj = {};
    tagState.forEach((v, k) => { obj[k] = v; });
    localStorage.setItem('tagState', JSON.stringify(obj));
}

const tagState = loadTagState();

function getActiveTags() {
    const allOn = [...tagState.values()].every(v => v);
    if (allOn) return null;  // no filter — show everything
    return new Set([...tagState.entries()].filter(([, v]) => v).map(([k]) => k));
}

function rebuildTagMenu() {
    const list = document.getElementById('topicsList');
    renderTagButtons(list);
}

/** After a tag change: render from cache if possible, else search forward */
function applyTagChange() {
    if (noTagsSelected()) {
        renderFeed();  // will show "Выберите хотя бы одну тему"
        return;
    }
    const visible = filterPosts(cachedPosts);
    if (visible.length > 0) {
        renderFeed();
    } else {
        loadFeed(undefined, 1);  // search forward from current selectedMMDD
    }
}

function renderTagButtons(list) {
    list.innerHTML = '';
    [...TAG_LABELS.keys()].forEach(tag => {
        const label = TAG_LABELS.get(tag) || tag;
        const btn = document.createElement('button');
        btn.className = 'topic-tag' + (tagState.get(tag) ? '' : ' off');
        btn.type = 'button';
        btn.textContent = label;
        btn.title = tag;
        btn.addEventListener('click', () => {
            tagState.set(tag, !tagState.get(tag));
            btn.classList.toggle('off', !tagState.get(tag));
            saveTagState();
            applyTagChange();
        });
        list.appendChild(btn);
    });
}

/**
 * Called on boot when the page is opened via a "#MM-DD-N" share link.
 * If the linked post's tags don't intersect the viewer's currently
 * active tags, temporarily (session-only, not saved to localStorage)
 * enable one of that post's tags so the post is visible.
 */
async function applyHashTagOverride(mmdd, anchorId) {
    try {
        const posts = await fetchDayPosts(mmdd); // unfiltered, full day list

        // Find the linked post using the same anchor-id scheme as createPost:
        // published.url fragment if present, else "MM-DD-<position>".
        let target = null;
        posts.forEach(({ post }, idx) => {
            const urlFragment = post.published && post.published.url
                ? post.published.url.split('#')[1]
                : null;
            const id = urlFragment || `${mmdd}-${idx + 1}`;
            if (id === anchorId) target = post;
        });

        if (!target) return;

        const tags = Array.isArray(target.tags) ? target.tags : [];
        if (tags.length === 0) return; // post with no tags is always visible

        const activeTags    = getActiveTags(); // null = all tags on
        const alreadyVisible = activeTags === null || tags.some(t => activeTags.has(t));
        if (alreadyVisible) return;

        // Prefer a canonical tag (known to the UI); fall back to the first tag.
        const tagToEnable = tags.find(t => tagState.has(t)) || tags[0];
        tagState.set(tagToEnable, true);
        // Intentionally no saveTagState() — this override is session-only.
    } catch (err) {
        console.error('applyHashTagOverride failed:', err);
    }
}

   Likes
───────────────────────────────────────── */

function getDeviceToken() {
    let token = localStorage.getItem('device_token');
    if (!token) {
        const bytes = new Uint8Array(32);
        crypto.getRandomValues(bytes);
        token = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
        localStorage.setItem('device_token', token);
    }
    return token;
}

async function likesRequest(postId, method, action) {
    const token = getDeviceToken();
    const url   = `likes.php?post_id=${encodeURIComponent(postId)}&device_token=${token}`;

    if (method === 'GET') {
        const r = await fetch(url);
        return r.json();
    }

    const body = new FormData();
    body.append('action', action);
    body.append('device_token', token);
    const r = await fetch(url, { method: 'POST', body });
    return r.json();
}

async function loadLikes() {
    document.querySelectorAll('.like-btn').forEach(async btn => {
        const postId = btn.dataset.postId;
        try {
            const d = await likesRequest(postId, 'GET');
            const countEl = btn.querySelector('.like-count');
            const iconEl  = btn.querySelector('.like-icon');
            countEl.textContent = d.count || '';
            iconEl.textContent  = d.liked ? '❤️' : '🤍';
            btn.classList.toggle('liked',     d.liked);
            btn.classList.toggle('has-likes', d.count > 0);
        } catch (_) {}
    });
}

document.addEventListener('click', async (e) => {
    const btn = e.target.closest('.like-btn');
    if (!btn) return;

    const postId  = btn.dataset.postId;
    const isLiked = btn.classList.contains('liked');
    const action  = isLiked ? 'unlike' : 'like';
    const countEl = btn.querySelector('.like-count');
    const iconEl  = btn.querySelector('.like-icon');
    const current = parseInt(countEl.textContent) || 0;

    // Optimistic update
    const newCount = !isLiked ? current + 1 : Math.max(0, current - 1);
    btn.classList.toggle('liked',     !isLiked);
    btn.classList.toggle('has-likes', newCount > 0);
    iconEl.textContent  = !isLiked ? '❤️' : '🤍';
    countEl.textContent = newCount || '';
    btn.disabled = true;

    try {
        const d = await likesRequest(postId, 'POST', action);
        btn.classList.toggle('liked',     d.liked);
        btn.classList.toggle('has-likes', d.count > 0);
        iconEl.textContent  = d.liked ? '❤️' : '🤍';
        countEl.textContent = d.count || '';
    } catch (_) {
        // Revert on failure
        btn.classList.toggle('liked',     isLiked);
        btn.classList.toggle('has-likes', current > 0);
        iconEl.textContent  = isLiked ? '❤️' : '🤍';
        countEl.textContent = current || '';
    } finally {
        btn.disabled = false;
    }
});

   Boot  — honour #MM-DD-N in the URL
───────────────────────────────────────── */

/* ─────────────────────────────────────────
   Pull-down at bottom → next day
───────────────────────────────────────── */

(function initEdgeNavigation() {
    const THRESHOLD = 72; // px drag needed to trigger

    // ── Hint bars ──
    function makeHint(edge) {
        const el = document.createElement('div');
        Object.assign(el.style, {
            position:       'fixed',
            [edge]:         '0',
            left:           '0',
            right:          '0',
            height:         '52px',
            display:        'flex',
            alignItems:     'center',
            justifyContent: 'center',
            fontSize:       '15px',
            fontWeight:     '600',
            fontFamily:     'Arial, sans-serif',
            color:          '#fff',
            transform:      edge === 'bottom' ? 'translateY(100%)' : 'translateY(-100%)',
            transition:     'transform .18s ease',
            zIndex:         '999',
            pointerEvents:  'none',
            userSelect:     'none',
        });
        document.body.appendChild(el);
        return el;
    }

    const hintNext = makeHint('bottom');
    const hintPrev = makeHint('top');

    function updateTheme() {
        const bg = document.body.classList.contains('dark')
            ? 'rgba(25,118,210,0.95)' : 'rgba(21,101,192,0.92)';
        hintNext.style.background = bg;
        hintPrev.style.background = bg;
    }
    updateTheme();
    new MutationObserver(updateTheme)
        .observe(document.body, { attributes: true, attributeFilter: ['class'] });

    function atBottom() {
        return window.innerHeight + window.scrollY >= document.body.scrollHeight - 6;
    }
    function atTop() {
        return window.scrollY <= 2;
    }
    // Page fits entirely in viewport (short content: 0 or 1 posts)
    function pageIsShort() {
        return document.body.scrollHeight <= window.innerHeight + 6;
    }

    function showHint(el, progress, readyText, pullText) {
        const pct = (1 - Math.min(progress, 1)) * 100;
        const isBottom = el === hintNext;
        el.style.transform = `translateY(${isBottom ? pct : -pct}%)`;
        el.textContent = progress >= 1 ? readyText : pullText;
    }

    function hideHint(el, defaultText) {
        const isBottom = el === hintNext;
        el.style.transform = isBottom ? 'translateY(100%)' : 'translateY(-100%)';
        el.textContent = defaultText;
    }

    // ── Touch ──
    let touchStartY = 0;
    let edge        = null; // 'next' | 'prev' | null
    let triggered   = false;

    document.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
        triggered   = false;
        edge        = null; // resolved on first move
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
        const dy = touchStartY - e.touches[0].clientY; // + = swipe up, - = swipe down

        // Resolve edge on first meaningful move if not yet set
        if (!edge) {
            if (Math.abs(dy) < 6) return; // ignore tiny jitter
            if (dy > 0 && atBottom())  { edge = 'next'; }
            else if (dy < 0 && atTop()) { edge = 'prev'; }
            // Short page: direction alone decides
            else if (pageIsShort() && dy > 0) { edge = 'next'; }
            else if (pageIsShort() && dy < 0) { edge = 'prev'; }
            else { edge = 'none'; }
        }

        if (edge === 'next' && dy > 0) {
            e.preventDefault();
            const p = dy / THRESHOLD;
            showHint(hintNext, p, '✓ Отпустите', '↓ Следующий день');
            if (p >= 1) triggered = true;
        } else if (edge === 'prev' && dy < 0) {
            e.preventDefault();
            const p = (-dy) / THRESHOLD;
            showHint(hintPrev, p, '✓ Отпустите', '↑ Предыдущий день');
            if (p >= 1) triggered = true;
        }
    }, { passive: false });

    document.addEventListener('touchend', () => {
        const wasEdge     = edge;
        const wasTriggered = triggered;
        edge      = null;
        triggered = false;
        hideHint(hintNext, '↓ Следующий день');
        hideHint(hintPrev, '↑ Предыдущий день');
        if (wasTriggered) {
            setTimeout(() => {
                if (!noTagsSelected()) {
                    const dir = wasEdge === 'next' ? 1 : -1;
                    const next = dir === 1 ? nextMMDD(selectedMMDD) : prevMMDD(selectedMMDD);
                    setMMDD(next, undefined, dir);
                }
            }, 120);
        }
    }, { passive: true });

    // ── Mouse wheel (desktop) ──
    let wheelAccum = 0;
    let wheelDir   = null;
    let wheelTimer = null;

    window.addEventListener('wheel', (e) => {
        const goingDown = e.deltaY > 0;
        const goingUp   = e.deltaY < 0;

        if (goingDown && atBottom()) {
            wheelDir = 'next';
        } else if (goingUp && atTop()) {
            wheelDir = 'prev';
        } else {
            wheelAccum = 0; wheelDir = null;
            hideHint(hintNext, '↓ Следующий день');
            hideHint(hintPrev, '↑ Предыдущий день');
            return;
        }

        wheelAccum += Math.abs(e.deltaY);
        const hint = wheelDir === 'next' ? hintNext : hintPrev;
        const p    = wheelAccum / (THRESHOLD * 4);
        showHint(hint, p,
            wheelDir === 'next' ? '✓ Следующий день…' : '✓ Предыдущий день…',
            wheelDir === 'next' ? '↓ Следующий день' : '↑ Предыдущий день');

        clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => {
            const go  = wheelAccum >= THRESHOLD * 4;
            const dir = wheelDir;
            wheelAccum = 0; wheelDir = null;
            hideHint(hintNext, '↓ Следующий день');
            hideHint(hintPrev, '↑ Предыдущий день');
            if (go) {
                const d = dir === 'next' ? 1 : -1;
                const next = d === 1 ? nextMMDD(selectedMMDD) : prevMMDD(selectedMMDD);
                setMMDD(next, undefined, d);
            }
        }, 400);
    }, { passive: true });
})();

initTheme();

// Populate tag menu immediately — doesn't depend on posts
rebuildTagMenu();

(async function boot() {
    const raw    = decodeURIComponent(location.hash.slice(1));  // e.g. "06-07-3"
    const parsed = parsePostHash(raw);

    if (parsed) {
        // If the linked post's topics aren't currently shown, enable one
        // of them for this session so the link actually reveals the post.
        await applyHashTagOverride(parsed.mmdd, raw);
        rebuildTagMenu();

        // The link contains a specific post: set the calendar to that day

        setMMDD(parsed.mmdd, raw);
    } else {
        setMMDD(todayMMDD());
    }
})();
